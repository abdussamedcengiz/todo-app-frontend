name: CI

# main'e her push ve her pull request'te calisir.
# Amac: lint hatasi ya da derlenmeyen bir degisiklik, canliya
# cikmadan once burada gorunsun.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint ve build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # npm onbellegi: paketleri her kosuda sifirdan indirmez.
          cache: npm

      # "npm install" kullaniliyor, "npm ci" degil: lock dosyasi Windows'ta
      # uretiliyor ve npm, Linux'ta cozulen wasm yedek paketlerini
      # (@tailwindcss/oxide-wasm32-wasi -> @emnapi/*) lock'a yazamiyor.
      # "npm ci" lock'un birebir ortusmesini sart kostugu icin bu yuzden
      # kiriliyordu. Karsiliginda lock tutarsizligi CI'da yakalanmiyor.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      # "npm run build" once "tsc -b" calistirir: tip hatasi varsa
      # build burada durur, bozuk paket uretilmez.
      - run: npm run build
